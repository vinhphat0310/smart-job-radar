name: Scheduled job pipeline

permissions:
  contents: read

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '3 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to run
        required: true
        default: remoteok
        type: choice
        options:
          - remoteok
          - remotive
      mode:
        description: Delivery mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - notify

concurrency:
  group: smart-job-radar-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check database connection
        run: python src/main.py --check-db
      - name: Check database schema
        run: python src/main.py --check-schema
      - name: Run scheduled RemoteOK notifications
        if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *'
        run: python src/main.py --run-remoteok --notify
      - name: Run scheduled Remotive notifications
        if: github.event_name == 'schedule' && github.event.schedule == '3 */6 * * *'
        run: python src/main.py --run-remotive --notify
      - name: Run manually selected source
        if: github.event_name == 'workflow_dispatch'
        run: python src/main.py --run-${{ inputs.source }} ${{ inputs.mode == 'notify' && '--notify' || '--dry-run' }}
